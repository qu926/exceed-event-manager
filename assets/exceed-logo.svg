<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="exceed-logo-title exceed-logo-desc">
  <title id="exceed-logo-title">EXCEED event logo</title>
  <desc id="exceed-logo-desc">A luxury purple and gold square logo with the word EXCEED.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="16%" r="92%">
      <stop offset="0" stop-color="#5d2b82"/>
      <stop offset=".48" stop-color="#2d1248"/>
      <stop offset="1" stop-color="#13091f"/>
    </radialGradient>
    <linearGradient id="gold" x1="12" y1="18" x2="116" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1a8"/>
      <stop offset=".24" stop-color="#d7a936"/>
      <stop offset=".5" stop-color="#fff0a0"/>
      <stop offset=".76" stop-color="#b77a19"/>
      <stop offset="1" stop-color="#f7dc78"/>
    </linearGradient>
    <linearGradient id="gem" x1="54" y1="23" x2="74" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d9ff"/>
      <stop offset=".45" stop-color="#9f52c4"/>
      <stop offset="1" stop-color="#4b176a"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#background)"/>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="9" y="9" width="110" height="110" rx="16" fill="none" stroke="#d9b44a" stroke-opacity=".28"/>

