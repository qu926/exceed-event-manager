    <path d="M64 22 72 32 64 42 56 32Z" fill="url(#gem)" stroke="#f4d87b" stroke-width=".8"/>
    <path d="M64 22v20M56 32h16" fill="none" stroke="#ffe991" stroke-opacity=".52" stroke-width=".7"/>
    <circle cx="43" cy="32" r="1.4" fill="#e9c65c"/>
    <circle cx="85" cy="32" r="1.4" fill="#e9c65c"/>
    <path d="M17 32h21M90 32h21" fill="none" stroke="url(#gold)" stroke-width="1"/>

    <g fill="url(#gold)" filter="url(#gold-glow)">
      <path d="M10 55h15v4H15v5h9v4h-9v6h10v4H10Z"/>
      <path d="M27 55h5.8l4.7 7.1 4.7-7.1H48l-7.6 11.3L48.3 78h-5.8l-5-7.5-5 7.5h-5.8l7.9-11.7Z"/>
