      <path d="M79 55h15v4H84v5h9v4h-9v6h10v4H79Z"/>
      <path fill-rule="evenodd" d="M96 55h8.5c8.7 0 13.5 4.1 13.5 11.5S113.2 78 104.5 78H96Zm5 4v15h3.4c5.7 0 8.6-2.4 8.6-7.5s-2.9-7.5-8.6-7.5Z"/>
